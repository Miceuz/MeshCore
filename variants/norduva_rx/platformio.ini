[norduva_rx]
extends = stm32_base
build_flags = ${stm32_base.build_flags}
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D LORA_TX_POWER=20
  -D P_LORA_NSS=PA4
  -D P_LORA_RESET=PA15
  -D P_LORA_DIO_0=PA11
  -D P_LORA_DIO_1=PA12
  -D PIN_SPI_SCK=PA5
  -D PIN_SPI_MISO=PA6
  -D PIN_SPI_MOSI=PA7
  -D P_LORA_TX_LED=PA2
  -D PIN_USER_BTN=PA1
  -D USER_BTN_PRESSED=LOW
  -D SERIAL_UART_INSTANCE=1
  -D PIN_SERIAL_TX=PA9
  -D PIN_SERIAL_RX=PA10
  -I variants/norduva_rx
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/norduva_rx>
lib_deps = ${stm32_base.lib_deps}

; STM32L432KC: 256k flash, 32k LittleFS
[norduva_rx_kc]
extends = norduva_rx
board = genericSTM32L432KC
board_upload.maximum_size = 229376
build_flags = ${norduva_rx.build_flags}
  -D NORDUVA_RX_FLASH_KB=256

; STM32L432KB: 128k flash, 16k LittleFS. Only fits with the size cuts below.
[norduva_rx_kb]
extends = norduva_rx
board = genericSTM32L432KB
board_upload.maximum_size = 114688
extra_scripts = ${stm32_base.extra_scripts}
  pre:variants/norduva_rx/size_cuts.py
build_flags = ${norduva_rx.build_flags}
  -D NORDUVA_RX_FLASH_KB=128
  -D LFS_FLASH_TOTAL_SIZE=16384
  -D NORDUVA_RX_SIZE_CUTS
  -D ED25519_NO_BASE_TABLE
  -D ED25519_EXTERNAL_SHA512
  -D CLI_MINIMAL
  -D RADIOLIB_TONE_UNSUPPORTED

[env:norduva_rx_kc_repeater]
extends = norduva_rx_kc
build_flags = ${norduva_rx_kc.build_flags}
  -D ADVERT_NAME='"Norduva RX Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${norduva_rx_kc.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:norduva_rx_kb_repeater]
extends = norduva_rx_kb
build_flags = ${norduva_rx_kb.build_flags}
  -D ADVERT_NAME='"Norduva RX Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${norduva_rx_kb.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
