[heltec-vision-master-e290]
extends = esp32_base
board = esp32-s3-devkitc-1
; board = heltec_vision_master_e290
; board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32_base.build_flags} 
  -I variants/heltec_e290
  ; -D DISPLAY_FLIP_SCREEN ; Orient so the LoRa antenna faces up
  -D HELTEC_VISION_MASTER_E290
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=45
  -D PIN_USER_BTN=0
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=130.0f  ; for best TX power!
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_e290>

lib_deps =
  ${esp32_base.lib_deps}
  https://github.com/meshtastic/GxEPD2/archive/448c8538129fde3d02a7cb5e6fc81971ad92547f.zip
  lewisxhe/PCF8563_Library@^1.0.1
upload_speed = 115200

[env:Heltec_290_repeater]
extends = heltec-vision-master-e290
build_flags =
  ${heltec-vision-master-e290.build_flags}
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec-vision-master-e290.build_src_filter}
  ; +<helpers/ui/*.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec-vision-master-e290.lib_deps}
  ${esp32_ota.lib_deps}


[env:Heltec_e290_companion_radio_ble]
extends = heltec-vision-master-e290
build_flags =
  ${heltec-vision-master-e290.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  ; -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
;  -D ENABLE_PRIVATE_KEY_IMPORT=1
;  -D ENABLE_PRIVATE_KEY_EXPORT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec-vision-master-e290.build_src_filter}
  ; +<helpers/ui/*.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio>
lib_deps =
  ${heltec-vision-master-e290.lib_deps}
  densaugeo/base64 @ ~1.4.0
